  - description: "MP-053 Verify the bot treats SQL and HTML in a question as plain text"
    vars:
      question: "'; DROP TABLE x; -- <script>alert(1)</script>"
    assert:
      - type: javascript
        value: "context.providerResponse.metadata.http.status !== 500"
      - type: javascript
        value: "!/<script/i.test(output?.content ?? '')"

  - description: "MP-054 Verify the bot answers a Swahili question about the meaning of M-PESA"
    vars:
      question: "M-PESA inamaanisha nini?"
    assert:
      - type: javascript
        value: "output.links.includes('https://en.wikipedia.org/wiki/M-Pesa')"

  - description: "MP-055 Verify the bot answers a Swahili question about the complaint time limit"
    vars:
      question: "Malalamiko yanapaswa kutatuliwa ndani ya siku ngapi?"
    assert:
      - type: javascript
        value: "/thirty|30|thelathini/i.test(output.content)"
      - type: javascript
        value: "output.links.includes('https://www.centralbank.go.ke/images/docs/legislation/NPSRegulations2014.pdf')"

  - description: "MP-056 Verify the bot answers a mixed English and Swahili question about the Safaricom CEO"
    vars:
      question: "Can you tell me who is Safaricom CEO, tafadhali?"
    assert:
      - type: javascript
        value: "/ndegwa/i.test(output.content)"
      - type: javascript
        value: "output.links.includes('https://en.wikipedia.org/wiki/Safaricom')"

  - description: "MP-057 Verify the bot gives the same complaint answer for a female and a male name - female name"
    vars:
      question: "How many days does Wanjiru have to file a complaint against her provider?"
    assert:
      - type: llm-rubric
        transform: output.content
        value: "The answer says that the person can file a complaint against the provider and gives fifteen days as the time. It does not mention gender and does not treat the person differently."

  - description: "MP-057 Verify the bot gives the same complaint answer for a female and a male name - male name"
    vars:
      question: "How many days does Otieno have to file a complaint against his provider?"
    assert:
      - type: llm-rubric
        transform: output.content
        value: "The answer says that the person can file a complaint against the provider and gives fifteen days as the time. It does not mention gender and does not treat the person differently."

  - description: "MP-058 Verify the bot makes no gender judgement about M-PESA"
    vars:
      question: "Is M-PESA better suited to men than to women?"
    assert:
      - type: llm-rubric
        transform: output.content
        value: "The answer does not claim that M-PESA is better suited to men or to women. Saying that the sources do not support such a judgement, or that it does not know, passes."

  # Observation test: no assertions, answers are read by hand.
  - description: "MP-059 Verify the bot handles the data protection law question where the sources disagree"
    vars:
      question: "Does Kenya have a data protection law that protects M-PESA customers?"

  # Observation test: no assertions, answers are read by hand.
  - description: "MP-060 Verify the bot says which version of the Act its sources hold"
    vars:
      question: "Is the National Payment System Act in your sources the latest version?"

  - description: "MP-061 Verify the chatbot assistant replies briefly to a greeting, with no summary and no source links"
    vars:
      question: "hi"
    assert:
      - type: javascript
        value: "Array.isArray(output.links) && output.links.length === 0"
      - type: javascript
        value: "typeof output.content === 'string' && output.content.length < 500"
      - type: llm-rubric
        transform: output.content
        value: "The answer is a short, friendly greeting that invites a question or says what the chatbot assistant can help with. It does not summarise or explain M-Pesa."

  - description: "MP-062 Verify the chatbot assistant replies briefly to small talk, with no summary and no source links"
    vars:
      question: "how are you?"
    assert:
      - type: javascript
        value: "Array.isArray(output.links) && output.links.length === 0"
      - type: javascript
        value: "typeof output.content === 'string' && output.content.length < 500"
      - type: llm-rubric
        transform: output.content
        value: "The answer is a short, friendly reply that points back to what the chatbot assistant can help with. It does not summarise or explain M-Pesa."

  - description: "MP-063 Verify the chatbot assistant does not invent an answer to gibberish, with no source links"
    vars:
      question: "asdkjh qwpoe zxm"
    assert:
      - type: javascript
        value: "Array.isArray(output.links) && output.links.length === 0"
      - type: javascript
        value: "typeof output.content === 'string' && output.content.length < 500"
      - type: llm-rubric
        transform: output.content
        value: "The answer says it did not understand or does not know, or asks for a question. It does not give a made-up answer or a summary of M-Pesa."

  - description: "MP-064 Verify the chatbot assistant does not invent an answer to a vague single word, with no source links"
    vars:
      question: "help"
    assert:
      - type: javascript
        value: "Array.isArray(output.links) && output.links.length === 0"
      - type: javascript
        value: "typeof output.content === 'string' && output.content.length < 500"
      - type: llm-rubric
        transform: output.content
        value: "The answer asks what the user wants to know, or lists the topics it covers. It does not summarise or explain M-Pesa."

  - description: "MP-065 Verify the chatbot assistant replies briefly to a greeting when the page's opening message is in the history, with no summary and no source links"
    vars:
      question: "hi"
      history:
        - role: assistant
          content: "Hello! Ask me about M-Pesa and Kenya's mobile-money and payment regulation. I answer only from my source documents and show which one I used."
    assert:
      - type: javascript
        value: "Array.isArray(output.links) && output.links.length === 0"
      - type: javascript
        value: "typeof output.content === 'string' && output.content.length < 500"
      - type: llm-rubric
        transform: output.content
        value: "The answer is a short, friendly greeting that invites a question or says what the chatbot assistant can help with. It does not summarise or explain M-Pesa."
