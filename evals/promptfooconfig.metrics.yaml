description: M-Pesa assistant, version 1, trial of the retrieval and answer metrics (MP-001 to MP-040)

prompts:
  - "{{question}}"

providers:
  - id: http://localhost:3000/api/chat
    config:
      method: POST
      headers:
        Content-Type: application/json
      body: '{"query": {{question | dump}}, "history": {{history | dump}}}'
      transformResponse: json

defaultTest:
  vars:
    history: []
    query: "{{ question }}"
  options:
    provider:
      id: openai:chat:gpt-4o
      config:
        temperature: 0

tests:
  - description: "MP-001 Verify the bot explains what PESA means in M-PESA"
    vars:
      question: "What does PESA mean in M-PESA?"
    assert:
      - type: context-faithfulness
        metric: faithfulness
        threshold: 0
        transform: output.content
        contextTransform: output.contexts
      - type: context-recall
        metric: context_recall
        threshold: 0
        contextTransform: output.contexts
        value: "PESA is Swahili for money (M for mobile)."
      - type: factuality
        metric: factuality
        transform: output.content
        value: "PESA is Swahili for money (M for mobile)."

  - description: "MP-002 Verify the bot names the two companies that launched M-PESA"
    vars:
      question: "Which two companies launched M-PESA?"
    assert:
      - type: context-faithfulness
        metric: faithfulness
        threshold: 0
        transform: output.content
        contextTransform: output.contexts
      - type: context-recall
        metric: context_recall
        threshold: 0
        contextTransform: output.contexts
        value: "Vodafone and Safaricom (launched 2007)."
      - type: factuality
        metric: factuality
        transform: output.content
        value: "Vodafone and Safaricom (launched 2007)."

  - description: "MP-003 Verify the bot lists the countries where M-PESA rollouts were terminated"
    vars:
      question: "In which countries were M-PESA rollouts terminated because of low uptake?"
    assert:
      - type: context-faithfulness
        metric: faithfulness
        threshold: 0
        transform: output.content
        contextTransform: output.contexts
      - type: context-recall
        metric: context_recall
        threshold: 0
        contextTransform: output.contexts
        value: "India, Romania and Albania."
      - type: factuality
        metric: factuality
        transform: output.content
        value: "India, Romania and Albania."

  - description: "MP-004 Verify the bot gives the Fuliza launch date and says what it is"
    vars:
      question: "When did Safaricom launch Fuliza and what is it?"
    assert:
      - type: context-faithfulness
        metric: faithfulness
        threshold: 0
        transform: output.content
        contextTransform: output.contexts
      - type: context-recall
        metric: context_recall
        threshold: 0
        contextTransform: output.contexts
        value: "8 January 2019; an M-PESA overdraft facility."
      - type: factuality
        metric: factuality
        transform: output.content
        value: "8 January 2019; an M-PESA overdraft facility."

  - description: "MP-005 Verify the bot names who took over M-PESA development in September 2009"
